<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Meta Explorer</title>
<style>
:root{
  color-scheme: light;
  --surface:#fcfcfb; --surface-2:#f3f2ee; --surface-3:#e9e7e1; --line:#dedcd5; --line-2:#c9c7bf;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7972;
  --s1:#2a78d6; --s2:#eb6834;
  --sea:#eef3f7; --ctx:#e3e1da; --focus:#0b0b0b;
  --pop:#ffffff; --shadow:0 8px 28px rgb(0 0 0 / .16);
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface:#1a1a19; --surface-2:#232322; --surface-3:#2d2c2a; --line:#383734; --line-2:#4a4944;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#97968d;
    --s1:#3987e5; --s2:#d95926;
    --sea:#1f2327; --ctx:#2a2a28; --focus:#f0efec;
    --pop:#2a2927; --shadow:0 8px 28px rgb(0 0 0 / .5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface:#1a1a19; --surface-2:#232322; --surface-3:#2d2c2a; --line:#383734; --line-2:#4a4944;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#97968d;
  --s1:#3987e5; --s2:#d95926;
  --sea:#1f2327; --ctx:#2a2a28; --focus:#f0efec;
  --pop:#2a2927; --shadow:0 8px 28px rgb(0 0 0 / .5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--surface);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.4}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,.t:focus-visible,.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}

/* header: one slim row */
.bar{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);flex:none;min-height:44px;background:var(--surface);position:relative;z-index:30}
h1{font-family:var(--serif);font-weight:400;font-size:1.1rem;margin:0;letter-spacing:-.01em;white-space:nowrap}
.sp{flex:1}
.dchips{display:flex;gap:6px}
.dchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;font-size:.8rem;color:var(--text-2)}
.dchip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.dchip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.dchip[aria-pressed="true"]{border-color:var(--text);color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tab{border:0;background:transparent;padding:3px 11px;border-radius:7px;cursor:pointer;color:var(--text-2);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgb(0 0 0/.14)}
.ib{width:28px;height:28px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;cursor:pointer;display:inline-grid;place-items:center;line-height:1;padding:0;flex:none}
.ib:hover{background:var(--surface-3)}
.about{position:absolute;right:10px;top:calc(100% + 6px);width:min(330px,92vw);background:var(--pop);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);font-size:.8rem;color:var(--text-2);line-height:1.45;z-index:50}
.about[hidden]{display:none}
.about p{margin:0 0 6px}.about p:last-child{margin:0}

/* stage: the view fills it, the Key Card floats on top */
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
#view{position:absolute;inset:0;overflow:auto;transition:right .22s ease}
#view.fill{overflow:hidden}
.stage.shrink #view{right:388px}
.fl{display:inline-block;width:20px;height:13px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px var(--line-2);flex:none;vertical-align:middle}
.fl svg{width:100%;height:100%;display:block}
.muted{color:var(--muted)}

/* globe */
.globewrap{position:absolute;inset:0}
svg.globe{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
svg.globe.grabbing{cursor:grabbing}
.g-sea{fill:var(--sea);stroke:var(--line-2);stroke-width:1}
.g-grat{fill:none;stroke:var(--line);stroke-width:.5;opacity:.6;pointer-events:none}
.g-shade{pointer-events:none}
.g-reg{fill:none;stroke:var(--surface);stroke-width:.55;opacity:.6;pointer-events:none;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.g-nat{fill:none;stroke:var(--surface);stroke-width:1.5;pointer-events:none;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.cn.byreg{stroke:none}
.cn.lined{stroke-width:1.5;stroke-linejoin:round}
.hl.hovr{stroke-width:1.6;fill:rgba(255,255,255,.28)}
.g-base{fill:var(--ctx);stroke:var(--surface);stroke-width:.5;vector-effect:non-scaling-stroke}
.ctx{fill:var(--ctx);stroke:var(--surface);stroke-width:.5;vector-effect:non-scaling-stroke;pointer-events:none}
.cn,.mk{cursor:pointer;transition:opacity .15s}
.cn{stroke:var(--surface);stroke-width:.8;vector-effect:non-scaling-stroke}
.mk{stroke:var(--surface);stroke-width:1.4}
.cn.dr,.mk.dr{fill:var(--s1)}
.cn.dl,.mk.dl{fill:var(--s2)}
.cn.off,.mk.off{opacity:.2}
.hl{fill:none;pointer-events:none;vector-effect:non-scaling-stroke;stroke:var(--focus)}
.hl.hov{stroke-width:1.8}
.hl.sel{stroke-width:3}
.lab{fill:var(--text);font-weight:600;pointer-events:none;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--surface);stroke-linejoin:round;opacity:.92}
.lab.off{opacity:.3}
.gctl{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
.gmsg{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);padding:4px 12px;border-radius:999px;background:var(--pop);border:1px solid var(--line-2);font-size:.78rem;color:var(--text-2);box-shadow:var(--shadow);transition:opacity .5s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.gmsg.hide{opacity:0}

/* look-alikes */
.gview{position:absolute;inset:0}
.gview svg{display:block;width:100%;height:100%}
.edge{stroke:var(--text-2);stroke-opacity:.38;stroke-width:1.6;fill:none;transition:stroke-opacity .15s}
.edge.on{stroke:var(--s1);stroke-opacity:1;stroke-width:3.4}
.edge-hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
.nodeg{cursor:pointer;transition:opacity .15s}
.nodeg.off{opacity:.2}
.nodeg .ring{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}
.nodeg.sel .ring{stroke:var(--focus);stroke-width:3}
.nodeg text{font-size:10.5px;fill:var(--text);font-weight:600;text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.pairbox{position:absolute;left:10px;top:10px;max-width:min(340px,70%);background:var(--pop);border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;font-size:.8rem;color:var(--text-2);box-shadow:var(--shadow)}
.pairbox b{color:var(--text);display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.pairbox .kind{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:999px;padding:0 7px;font-weight:500}
.pairbox p{margin:3px 0 0}

/* table */
table.tb{border-collapse:collapse;width:100%;font-size:.82rem}
.tb th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line-2);cursor:pointer;white-space:nowrap;z-index:2;font-weight:600}
.tb td{padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb tr{cursor:pointer}
.tb tbody tr:hover td{background:var(--surface-2)}
.tb tr.sel td{background:var(--surface-3)}
.tb .cn-name{display:flex;gap:8px;align-items:center;font-weight:600}
.tb .dom{color:var(--muted);font-weight:400}

/* tooltip */
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--pop);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;width:max-content;max-width:260px;font-size:.78rem;line-height:1.38;color:var(--text-2)}
.tip[hidden]{display:none}
.tip .h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text);font-size:.84rem}
.tip .tt{font-weight:700;color:var(--text);margin-bottom:3px;font-size:.82rem}
.tip .big{display:flex;justify-content:center;margin:5px 0}
.tip .tp{margin-top:3px}

/* drawings */
.draw svg{width:100%;height:100%;display:block}
.draw-bollard,.draw-pole{height:80px;aspect-ratio:120/200}
.draw-road{width:96px;aspect-ratio:200/150}
.draw-plate{width:100%;max-width:150px}
.draw-plate svg{height:auto}
.tip .draw-bollard,.tip .draw-pole{height:150px}
.tip .draw-road{width:170px}
.tip .draw-plate{width:180px;max-width:none}

/* Key Card */
.card{position:absolute;top:8px;right:8px;width:372px;height:545px;max-height:calc(100% - 16px);overflow:hidden;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);z-index:20;transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none;transition:transform .22s ease,opacity .18s ease}
.card.open{transform:none;opacity:1;pointer-events:auto}
.kc-h{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.kc-flag{width:30px;height:20px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--line-2);flex:none}
.kc-flag svg{width:100%;height:100%;display:block}
.kc-name{font-weight:700;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.kc-dom{color:var(--muted);font-weight:500;margin-left:-3px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px 1px 6px;border-radius:999px;border:1px solid var(--line-2);font-size:.74rem;white-space:nowrap;background:var(--surface-2);cursor:help}
.pill svg{width:22px;height:14px}
.kc-b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1;min-height:0;overflow:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.t{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:5px 6px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:help}
.t:hover{border-color:var(--line-2)}
.tk{font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.t .art{display:flex;align-items:center;justify-content:center;flex:1;min-height:30px}
.t .tl{display:flex;flex-direction:column;line-height:1.22;min-width:0}
.t .tl b{font-size:.74rem;font-weight:600}
.t .tl span{font-size:.68rem;color:var(--muted)}
.t.na{border-style:dashed;background:transparent}
.t .ttxt{font-size:.68rem;line-height:1.25;color:var(--text-2);text-align:left;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.t.na .art{color:var(--muted);font-size:.7rem;text-align:center;line-height:1.2}
.sample{font-size:.92rem;font-weight:600;line-height:1.25;overflow-wrap:anywhere;display:flex;align-items:center;flex:1;min-height:30px}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:1px 9px;font-size:.72rem;color:var(--text-2);cursor:help}
.houses{font-size:.74rem;color:var(--text-2);line-height:1.35;cursor:help}
.houses b{color:var(--muted);font-weight:600;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;margin-right:4px}
.twl{display:flex;flex-direction:column;gap:1px;margin-top:auto}
.rd{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:6px}
.rr{display:flex;gap:8px;align-items:baseline}
.rk{flex:none;width:50px;font-size:.62rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chs{display:flex;flex-wrap:wrap;gap:3px 4px;min-width:0}
.wd{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:0 6px;font-size:.74rem;line-height:1.55;color:var(--text);cursor:help;white-space:nowrap}
.wd.lt{font-size:.82rem;min-width:22px;text-align:center;padding:0 4px}
.wd.gv{font-weight:700;border-color:var(--line-2);background:var(--surface)}
.wd.pf{font-weight:600;font-variant-numeric:tabular-nums}
.wd.rg{cursor:default;color:var(--text-2)}
.wd.more{color:var(--muted);border-style:dashed}
.sbar{display:flex;align-items:center;gap:6px 12px;padding:6px 10px;border-bottom:1px solid var(--line);flex:none;background:var(--surface);position:relative;z-index:31}
.sbox{position:relative;flex:1 1 360px;min-width:0}
.sico{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.sin{width:100%;height:34px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--text);padding:0 34px 0 32px;font:inherit}
.sx{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;background:transparent}
.sx[hidden]{display:none}
.sres{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--text-2);min-width:0;flex:0 1 auto}
.sres[hidden]{display:none}
.sres .fls{display:flex;gap:4px;align-items:center}
.sres .fls button{border:0;background:transparent;padding:0;cursor:pointer;line-height:0;border-radius:3px}
.sres .fls .fl{width:22px;height:15px}
.sres .more{color:var(--muted);font-size:.72rem}
.sres .nt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn.wk,.mk.wk{opacity:.5}
.preg{fill:rgba(255,255,255,.5);stroke:var(--text);stroke-width:1.7;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer}
.ptown{fill:#fff;stroke:var(--text);stroke-width:2;cursor:pointer}
.plab{fill:var(--text);font-weight:700;pointer-events:none;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
.wd.rg[data-q]{cursor:pointer}
.lab.wk{opacity:.6}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--pop);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);z-index:30;max-height:340px;overflow:auto}
.sug[hidden]{display:none}
.sug li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:.86rem}
.sug li[aria-selected="true"],.sug li:hover{background:var(--surface-2)}
.sug .ty{flex:none;width:78px;font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sug .k{font-weight:600;white-space:nowrap}
.sug .m{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.sug .fls{display:flex;gap:3px;align-items:center;flex:none}
.sug .fl{width:18px;height:12px}
.sug .more{font-size:.68rem;color:var(--muted)}

.tw{display:flex;gap:7px;align-items:center;border:0;background:transparent;padding:3px 4px;border-radius:7px;cursor:pointer;text-align:left;width:100%;font-size:.74rem}
.tw:hover{background:var(--surface-2)}
.tw .nm{font-weight:600;white-space:nowrap}
.tw .tx{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* Key Card tabs and route numbering */
.kc-tabs{display:flex;gap:2px;margin:6px 10px 0;background:var(--surface-2);padding:2px;border-radius:9px;border:1px solid var(--line);flex:none}
.kc-tab{flex:1;border:0;background:transparent;padding:3px 8px;border-radius:7px;cursor:pointer;color:var(--text-2);font:inherit;font-size:.78rem;font-weight:500}
.kc-tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line-2)}
.kc-tab:focus-visible{outline:2px solid var(--text-2);outline-offset:1px}
.kc-r{padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;overflow:auto}
.kc-b[hidden],.kc-r[hidden]{display:none}
.rt-map svg{width:100%;height:auto;max-height:330px;display:block;font-family:inherit}
.rt-lg{display:flex;flex-direction:column;gap:3px;font-size:.74rem;color:var(--text-2)}
.rt-lg div{display:flex;align-items:center;gap:7px;line-height:1.3}
.rt-sw{flex:none;width:18px;height:3px;border-radius:2px}
.rt-sw.zone{width:12px;height:12px;border-radius:50%;border:1px dashed var(--muted);background:transparent;margin:0 3px}
.rt-sw.hub{width:7px;height:7px;border-radius:50%;background:var(--text);margin:0 5.5px}
.rt-s{font-size:.78rem;line-height:1.42;color:var(--text);margin:0}
.rt-n{font-size:.68rem;line-height:1.38;color:var(--muted);margin:0;border-top:1px solid var(--line);padding-top:6px}
.rt-k{font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}

@media (max-width: 760px){
  .bar{flex-wrap:wrap;gap:6px 8px;padding:6px 8px}
  h1{display:none}
  .sbar{flex-wrap:wrap;padding:6px 8px}
  .sres{flex:1 1 100%}
  #info{order:4}
  .tabs{order:5;width:100%}
  .tab{flex:1;text-align:center}
  .card{position:fixed;left:0;right:0;top:auto;bottom:0;width:auto;height:auto;max-height:82vh;border-radius:16px 16px 0 0;transform:translateY(105%);z-index:40}
  .card.open{transform:none}
  .stage.shrink #view{right:0}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>World Meta Explorer</h1>
    <div class="dchips" id="drive" role="group" aria-label="Driving side"></div>
    <span class="sp"></span>
    <nav class="tabs" role="tablist" aria-label="Views" id="tabs"></nav>
    <button class="ib" id="info" aria-label="About" aria-expanded="false" title="About">i</button>
    <div class="about" id="about" hidden></div>
  </header>
  <div class="sbar" id="sbar" role="search">
    <div class="sbox"><svg class="sico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 10l4.2 4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input class="sin" id="sq" type="text" role="combobox" aria-expanded="false" aria-controls="ssug" aria-autocomplete="list" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Decode a sign: street, route, region, town, letters, .domain, or a country" aria-label="Decode text from a sign: a street, route, region, town, letters, script, domain or country name. Matching countries, regions and towns light up on the globe.">
      <button class="ib sx" id="sx" aria-label="Clear" title="Clear (Esc)" hidden>✕</button>
      <ul class="sug" id="ssug" role="listbox" hidden></ul></div>
    <div class="sres" id="sres" aria-live="polite" hidden></div>
  </div>
  <main class="stage" id="stage">
    <div id="view"></div>
    <aside class="card" id="card" aria-label="Country Key Card" aria-hidden="true"></aside>
  </main>
</div>
<div class="tip" id="tip" hidden></div>
<script src="d3.min.js?v=2026-11-19a"></script>
<script src="topojson-client.min.js?v=2026-11-19a"></script>
<script src="render.js?v=2026-11-19a"></script>
<script src="flags.js?v=2026-11-19a"></script>
<script src="data.js?v=2026-11-19a"></script>
<script src="geo.js?v=2026-11-19a"></script>
<script src="world.js?v=2026-11-19a"></script>
<script src="clues.js?v=2026-11-19a"></script>
<script src="clues_world.js?v=2026-11-19a"></script>
<script src="search.js?v=2026-11-19a"></script>
<script src="routes.js?v=2026-11-19a"></script>
<script src="app.js?v=2026-11-19a"></script>
</body>
</html>
